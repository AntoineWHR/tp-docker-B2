services:
  db:
    image: postgres:16-alpine
    container_name: b2_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-appdb}
      POSTGRES_USER: ${POSTGRES_USER:-appuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-apppass}
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-appuser} -d ${POSTGRES_DB:-appdb}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - b2_net

  web1:
    build: ./web
    container_name: b2_web1
    environment:
      DB_HOST: db
      DB_NAME: ${POSTGRES_DB:-appdb}
      DB_USER: ${POSTGRES_USER:-appuser}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-apppass}
    volumes:
      - ./web1/html:/usr/share/nginx/html:ro
    depends_on:
      db:
        condition: service_healthy
    networks:
      - b2_net

  web2:
    build: ./web
    container_name: b2_web2
    environment:
      DB_HOST: db
      DB_NAME: ${POSTGRES_DB:-appdb}
      DB_USER: ${POSTGRES_USER:-appuser}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-apppass}
    volumes:
      - ./web2/html:/usr/share/nginx/html:ro
    depends_on:
      db:
        condition: service_healthy
    networks:
      - b2_net

  lb:
    image: nginx:1.27-alpine
    container_name: b2_load_balancer
    ports:
      - "8080:80"
    volumes:
      - ./loadbalancer/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - web1
      - web2
    networks:
      - b2_net

  backup:
    build: ./backup-server
    container_name: b2_backup_server
    volumes:
      - backup_data:/backups
      - ./ssh:/ssh:ro
    ports:
      - "2222:22"
    networks:
      - b2_net

  backup-client:
    build: ./backup-client
    container_name: b2_backup_client
    environment:
      RESTIC_REPOSITORY: sftp:backup@backup:/backups/restic-repo
      RESTIC_PASSWORD: ${RESTIC_PASSWORD:-ChangeMe_Restic_B2}
      SSH_KEY: /ssh/id_ed25519
      POSTGRES_HOST: db
      POSTGRES_DB: ${POSTGRES_DB:-appdb}
      POSTGRES_USER: ${POSTGRES_USER:-appuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-apppass}
    volumes:
      - ./ssh:/ssh:ro
      - ./web1/html:/data/web1:ro
      - ./web2/html:/data/web2:ro
      - restore_data:/restore
    depends_on:
      backup:
        condition: service_started
      db:
        condition: service_healthy
    networks:
      - b2_net

networks:
  b2_net:
    driver: bridge

volumes:
  db_data:
  backup_data:
  restore_data:
